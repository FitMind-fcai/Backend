[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    unit: Pure unit tests — no DB, no HTTP
    integration: FastAPI TestClient tests with mocked external services
    evaluation: AI output evaluation scripts (require GROQ_API_KEY)
