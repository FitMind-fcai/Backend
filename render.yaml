databases:
  - name: fitmind-db
    plan: free
    databaseName: fitmind_db
    user: fitmind
    postgresMajorVersion: "16"

services:
  - type: web
    name: fitmind-backend
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fitmind-db
          property: connectionURI
      - key: REDIS_HOST
        value: ""
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        value: ""
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-landing.vercel.app"
      - key: AI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: "openrouter"
      - key: AI_MODEL
        value: "qwen/qwen3-235b-a22b-2507"
      - key: AI_COACH_TEMPERATURE
        value: "0.1"
      - key: AI_COACH_MAX_TOKENS
        value: "6000"
      - key: GROQ_API_KEY
        sync: false
      - key: SMTP_SERVER
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SENDER_EMAIL
        sync: false
      - key: SENDER_PASSWORD
        sync: false
      - key: ENVIRONMENT
        value: "production"
      - key: RESEED_DB
        value: "false"
      - key: REBUILD_VECTOR_DB
        value: "false"
      - key: SCRAPE_RESOURCES
        value: "false"
      - key: VECTOR_DB_PATH
        value: "chroma_db"
      - key: APP_URL
        fromService:
          name: fitmind-backend
          type: web
          property: host
